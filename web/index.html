<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176e7b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mark">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/mark-icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/mark-icon-192.png">
  <title>Салаватстекло — AI-маркетолог</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>
<body>
  <div class="stage">
    <div class="device" id="device">

      <!-- мягкий фон под стекло -->
      <div class="ambient" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
      </div>

      <!-- Экран входа -->
      <section id="screen-auth" class="screen auth"></section>

      <!-- Приложение -->
      <section id="screen-app" class="hidden">
        <aside id="sidebar" class="sidebar" aria-label="Основная навигация"></aside>
        <main id="view" class="view"></main>

        <nav class="tabbar glass" id="tabbar">
          <button class="tab on" data-action="tab" data-tab="home"><i data-lucide="house" class="ic"></i><span>Обзор</span></button>
          <button class="tab" data-action="tab" data-tab="content"><i data-lucide="layers" class="ic"></i><span>Контент</span></button>
          <button class="tab" data-action="tab" data-tab="schedule"><i data-lucide="calendar" class="ic"></i><span>Расписание</span></button>
          <button class="tab" data-action="tab" data-tab="analytics"><i data-lucide="chart-line" class="ic"></i><span>Аналитика</span></button>
          <button class="tab" data-action="tab" data-tab="profile"><i data-lucide="circle-user" class="ic"></i><span>Профиль</span></button>
        </nav>
      </section>

      <!-- Нижние листы (sheets) -->
      <div id="sheet-layer" class="sheet-layer hidden">
        <div class="sheet-backdrop" data-action="close-sheet"></div>
        <div class="sheet" id="sheet"></div>
      </div>

      <div id="toast" class="toast"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
